- name: Restrict ptrace_scope
  ansible.posix.sysctl:
    name: "kernel.yama.ptrace_scope"
    value: 2
    sysctl_file: /etc/sysctl.d/10-ptrace.conf

- name: Copy blacklist-act-pedit.conf
  ansible.builtin.copy:
    src: ../files/blacklist-act-pedit.conf
    dest: /etc/modprobe.d/blacklist-act-pedit.conf

- name: Copy dirtyfrag.conf
  ansible.builtin.copy:
    src: ../files/dirtyfrag.conf
    dest: /etc/modprobe.d/dirtyfrag.conf

- name: Copy disable-cifs.conf
  ansible.builtin.copy:
    src: ../files/disable-cifs.conf
    dest: /etc/modprobe.d/disable-cifs.conf

- name: Check if nfs-common is needed
  raw: which mount.nfs
  register: need_nfs
  failed_when: false
  changed_when: false
  # This command should always run, even in check mode
  check_mode: false
  tags:
    - facts
- name: Install nfs-common
  raw:
    apt-get update && \
    DEBIAN_FRONTEND=noninteractive apt-get install -y nfs-common
  become: true
  when:
    - need_nfs.rc != 0
